name: Publishing

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (for example v0.1.0)"
        required: true
        type: string
      target:
        description: "Commit SHA the tag must point to"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  classify:
    name: Classify release
    runs-on: ubuntu-latest
    outputs:
      is_software_release: ${{ steps.tag.outputs.is_software_release }}
    steps:
      - name: Classify tag
        id: tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "is_software_release=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_software_release=false" >> "$GITHUB_OUTPUT"
          fi

  preflight:
    name: Validate and build
    needs: classify
    if: needs.classify.outputs.is_software_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout target
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          ref: ${{ inputs.target }}
          fetch-depth: 0

      - name: Verify tag points to target
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail
          tag_sha="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq '.sha')"
          test "$tag_sha" = "$TARGET"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@d4b2f3b6ecc6e67c4457f6d3e41ec42d3d0fcb86  # v5

      - name: Ensure GnuPG is available
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gnupg
          gpg --version

      - name: Install dependencies
        run: uv sync --locked --extra dev --python 3.12

      - name: Lint
        run: uv run ruff check .

      - name: Test
        run: uv run pytest -q

      - name: Check release metadata
        run: uv run python scripts/release_check.py --tag "${{ inputs.tag }}"

      - name: Build
        run: uv build --out-dir dist

      - name: Check distributions
        run: uv run --with twine twine check dist/*

      - name: Smoke test the wheel
        run: |
          set -euo pipefail
          tmp="$(mktemp -d)"
          uv run --isolated --with dist/*.whl gpg-mcp --help
          uv run --isolated --with dist/*.whl gpg-mcp init --home "$tmp/gnupg" --config "$tmp/config.toml"
          uv run --isolated --with dist/*.whl gpg-mcp doctor --home "$tmp/gnupg" --config "$tmp/config.toml"

      - name: Upload release assets
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-assets
          path: |
            dist/
            server.json
            release/notes/${{ inputs.tag }}.md
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish
    needs: [classify, preflight]
    if: needs.classify.outputs.is_software_release == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: pypi
      url: https://pypi.org/project/gpg-mcp
    permissions:
      contents: write
      id-token: write
    steps:
      - name: Download release assets
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-assets
          path: artifacts

      - name: Verify tag exists
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" >/dev/null

      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          notes="artifacts/release/notes/$TAG.md"
          test -f "$notes"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --draft --title "$TAG" --notes-file "$notes"
          else
            gh release create "$TAG" --draft --title "$TAG" --notes-file "$notes"
          fi
          gh release upload "$TAG" artifacts/dist/* --clobber

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086  # release/v1
        with:
          packages-dir: artifacts/dist/

      - name: Wait for PyPI
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          for _ in $(seq 1 30); do
            if curl -fsS "https://pypi.org/pypi/gpg-mcp/$version/json" >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          curl -fsS "https://pypi.org/pypi/gpg-mcp/$version/json" >/dev/null

      - name: Publish to MCP Registry
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.4/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          jq --arg v "$version" '.version = $v | .packages[0].version = $v' artifacts/server.json > server.json
          python -m json.tool server.json >/dev/null
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish

      - name: Finalize release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
        run: gh release edit "$TAG" --draft=false --latest
