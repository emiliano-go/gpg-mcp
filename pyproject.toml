[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gpg-mcp"
version = "0.1.0"
description = "A security-focused Model Context Protocol server for GnuPG"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Emiliano G.O." }]
keywords = ["gpg", "gnupg", "openpgp", "mcp", "security", "signing"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security :: Cryptography",
]
dependencies = ["mcp>=2.3,<3"]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.6",
]

[project.scripts]
gpg-mcp = "gpg_mcp.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/gpg_mcp"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
